# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
ignore = [
    # `paste` is unmaintained with no replacement available. It is a compile-time
    # proc-macro pulled in transitively by soroban-sdk's host dependencies
    # (ark-ff, wasmi_core) and ships no code in the contract. Revisit when
    # soroban-sdk drops it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro via soroban-sdk; no runtime code, no upgrade available" },

    # Timing variability in `crypto-bigint` 0.5.5 operations meant to be
    # constant-time. It reaches us only through soroban-env-host, the native
    # host used to run the unit tests:
    #
    #   crypto-bigint <- elliptic-curve <- ecdsa/k256/p256 <- soroban-env-host
    #
    # `cargo tree --target wasm32v1-none -e normal -i crypto-bigint` prints
    # nothing, so none of it is compiled into the deployed contract, and this
    # contract performs no signature or key operations of its own in any case.
    # The fix is crypto-bigint 0.7.6, a semver-incompatible bump that
    # elliptic-curve 0.13 cannot take, so it has to come from upstream.
    # Revisit when soroban-sdk ships a host built on elliptic-curve 0.14.
    { id = "RUSTSEC-2026-0387", reason = "timing side-channel in the native test host only; absent from the wasm build, no compatible upgrade" },
]

[licenses]
# Every dependency must be available under at least one of these licenses.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
