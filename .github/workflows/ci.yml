name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: "28.0.0"
  STELLAR_CLI_SHA256: "207544486734fccb4df1afc4a7745478f9f1e21688b2f9506f0ef36f60ce3fdc"
  # Maximum contract Wasm size accepted by the network (128 KiB).
  WASM_SIZE_LIMIT: "131072"

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --locked

  wasm:
    name: Build contract Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Install Stellar CLI
        run: |
          archive="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${archive}"
          echo "${STELLAR_CLI_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/stellar-cli"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/stellar-cli"
          bin="$(find "$RUNNER_TEMP/stellar-cli" -type f -name stellar | head -n 1)"
          chmod +x "$bin"
          dirname "$bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          stellar --version
          stellar contract build

      - name: Check Wasm size
        run: |
          size="$(stat -c%s target/wasm32v1-none/release/upstream.wasm)"
          echo "upstream.wasm: ${size} bytes (limit ${WASM_SIZE_LIMIT})"
          test "$size" -le "$WASM_SIZE_LIMIT"
